<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
<title>Daily Challenge – Vocabulary Builder (Static)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
canvas { display: block; }

#overlay {
  position: fixed; inset: 0;
  background: rgba(0, 5, 20, 0.92);
  display: flex; align-items: center; justify-content: center;
  color: #fff; z-index: 10;
}
#overlay.hidden { display: none; }

.screen { text-align: center; max-width: 640px; padding: 2rem; width: 100%; }
.screen h1 { font-size: 2.4rem; color: #ffcc44; margin-bottom: 0.4rem; letter-spacing: 2px; }
.screen .subtitle { color: #556677; margin-bottom: 2rem; font-size: 0.95rem; }

.btn-row { display: flex; gap: 0.8rem; justify-content: center; margin-top: 1.2rem; flex-wrap: wrap; }
.btn {
  padding: 0.65rem 1.6rem; border-radius: 8px;
  background: #0d2a44; border: 2px solid #2a6a9a;
  color: #88ccff; cursor: pointer; font-size: 0.95rem; font-weight: 600;
  transition: background 0.15s;
}
.btn:hover { background: #1a3a5a; }
.btn.primary { background: #114422; border-color: #2a8a4a; color: #66ee88; }
.btn.primary:hover { background: #1a5530; }
.btn.reward { background: #332200; border-color: #886611; color: #ffcc44; }
.btn.reward:hover { background: #443300; }
.btn:disabled { opacity: 0.4; cursor: default; }

.stats-row { display: flex; gap: 2rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .val { font-size: 2rem; font-weight: 700; color: #88ddff; }
.stat .lbl { font-size: 0.8rem; color: #556677; }

.word-result {
  padding: 0.45rem 0.8rem; border-radius: 6px;
  font-size: 0.85rem; font-weight: 600; text-align: left;
  display: inline-block; margin: 0.2rem;
}
.word-result.ok  { background: #0a2a0a; border: 1px solid #2a6a2a; color: #88ee88; }
.word-result.err { background: #2a0a0a; border: 1px solid #6a2a2a; color: #ee8888; }

.daily-card {
  background: #0a1a2a; border: 2px solid #1a3a5a; border-radius: 12px;
  padding: 1.5rem; margin: 1rem 0; text-align: left;
}
.daily-card h3 { color: #ffcc44; margin-bottom: 0.5rem; }
.daily-card p { color: #aabbcc; font-size: 0.9rem; line-height: 1.5; }

.streak-display {
  display: inline-block; background: #1a1a00; border: 2px solid #4a4a00;
  border-radius: 12px; padding: 0.4rem 1rem; margin: 0.5rem;
  color: #ffcc44; font-size: 1.1rem; font-weight: 700;
}

.mini-game-card {
  background: #1a0a2a; border: 2px solid #4a2a6a; border-radius: 12px;
  padding: 1.2rem; margin: 0.5rem; cursor: pointer; transition: transform 0.1s, background 0.15s;
  text-align: center; min-width: 140px;
}
.mini-game-card:hover { background: #2a1a3a; transform: scale(1.03); }
.mini-game-card .emoji { font-size: 2rem; margin-bottom: 0.3rem; }
.mini-game-card .name { color: #cc88ff; font-size: 0.85rem; font-weight: 600; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="overlay">
  <div class="screen" id="screen-loading">
    <h1>☀️ Daily Challenge</h1>
    <p class="subtitle">Loading…</p>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const DAILY_WORDS     = 5;    // words per daily challenge
const TOKEN_FONT      = 'bold 20px monospace';
const TOKEN_H         = 44;
const TOKEN_PAD_X     = 14;
const BASE_SPEED      = 1.26;
const SPEED_INC       = 0.0;  // no phase-based speed increase for daily
const GRAD_STREAK     = 3;
const REVIEW_STREAK   = 1;
const COOLDOWN_DAYS   = 30;

// ── State ─────────────────────────────────────────────────────────────────────
let allWords    = [];
let progress    = {};
let canvas, ctx, animId;
let gameRunning = false;

// Daily state
let dailyQueue    = [];
let tokens        = [];
let activeWord    = null;
let wordResolved  = false;
let score         = 0;
let wrongClicks   = 0;
let timeouts      = 0;
let dailyResults  = [];
let sentenceCard  = null;
let waitingForSpawn = false;
let paused        = false;
let consecutiveCorrect = 0;

// Mini game state
let miniGameActive = false;
let miniGameType   = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0, 10); }

function seededRandom(seed) {
  let s = 0;
  for (let i = 0; i < seed.length; i++) s = ((s << 5) - s) + seed.charCodeAt(i);
  return function() {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

function shuffle(arr, rng) {
  const random = rng || Math.random;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function wd() {
  if (!progress.word_drop) progress.word_drop = { current_phase: 0, word_stats: {}, best_scores: {}, speed_multiplier: 1.0, sound_enabled: true, badges: [], badge_dates: {}, play_dates: [], reconfirmed: 0 };
  return progress.word_drop;
}

function daily() {
  if (!progress.daily) progress.daily = { streak: 0, last_played: null, games_today: 0, total_days: 0, mini_games_unlocked: 0 };
  return progress.daily;
}

function wordStat(word) {
  if (!wd().word_stats[word]) wd().word_stats[word] = { streak: 0, total_errors: 0, graduated: false, graduated_date: null, review_mode: false, errors: [] };
  return wd().word_stats[word];
}

// ── Canvas setup ──────────────────────────────────────────────────────────────
canvas = document.getElementById('canvas');
ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Stars background
const stars = Array.from({ length: 60 }, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + 0.5
}));

function drawStars() {
  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.3 + Math.random() * 0.3;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── Overlay helpers ───────────────────────────────────────────────────────────
function showOverlay(html) {
  const el = document.getElementById('overlay');
  el.innerHTML = `<div class="screen">${html}</div>`;
  el.classList.remove('hidden');
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadAll() {
  try {
    const dr = await fetch('data/misspellings.json');
    allWords = await dr.json();
    const saved = localStorage.getItem('vb_progress');
    const loaded = saved ? JSON.parse(saved) : {};
    if (loaded) Object.assign(progress, loaded);
    showDailyHome();
  } catch (e) {
    document.getElementById('screen-loading').innerHTML =
      `<h1 style="color:#ff4444">Error</h1><p style="color:#aaa">${e.message}</p>`;
  }
}

function saveProgress() {
  localStorage.setItem('vb_progress', JSON.stringify(progress));
}

// ── Daily word selection (seeded by date) ─────────────────────────────────────
function buildDailyQueue() {
  const today = todayStr();
  const rng = seededRandom(today + '_daily_' + daily().games_today);
  const stats = wd().word_stats || {};

  // Mix: prioritize words with errors (review), then introduce new ones
  const needsReview = allWords.filter(w => {
    const s = stats[w.word];
    return s && s.total_errors > 0 && !s.graduated;
  });

  const unseen = allWords.filter(w => {
    const s = stats[w.word];
    return !s || (s.streak === 0 && s.total_errors === 0);
  });

  const eligible = allWords.filter(w => {
    const s = stats[w.word];
    return !s || !s.graduated;
  });

  // Prioritize: some review + some new
  let pool = [];
  if (needsReview.length >= 2) {
    shuffle(needsReview, rng);
    pool.push(...needsReview.slice(0, 2));
  }
  if (unseen.length > 0) {
    shuffle(unseen, rng);
    const take = DAILY_WORDS - pool.length;
    pool.push(...unseen.slice(0, take));
  }
  // Fill remaining from eligible
  if (pool.length < DAILY_WORDS) {
    const remaining = eligible.filter(w => !pool.includes(w));
    shuffle(remaining, rng);
    pool.push(...remaining.slice(0, DAILY_WORDS - pool.length));
  }
  // If still short (all graduated), pull from graduated for spaced review
  if (pool.length < DAILY_WORDS) {
    const graduated = allWords.filter(w => !pool.includes(w));
    shuffle(graduated, rng);
    pool.push(...graduated.slice(0, DAILY_WORDS - pool.length));
  }

  return pool.slice(0, DAILY_WORDS);
}

// ── Daily home screen ─────────────────────────────────────────────────────────
function showDailyHome() {
  const d = daily();
  const today = todayStr();

  // Update streak
  if (d.last_played === today) {
    // Already played today
  } else if (d.last_played === getYesterday()) {
    // Consecutive day — streak maintained
  } else if (d.last_played && d.last_played !== today) {
    // Streak broken
    d.streak = 0;
  }

  const gamesPlayed = (d.last_played === today) ? d.games_today : 0;
  const miniUnlocked = gamesPlayed >= 1;
  const streakEmoji = d.streak >= 7 ? '🔥' : d.streak >= 3 ? '⭐' : '📅';

  const miniGameBtn = miniUnlocked
    ? `<button class="btn reward" onclick="showMiniGamePicker()">🎮 Play Mini Game!</button>`
    : `<button class="btn" disabled>🎮 Mini Game (complete a daily to unlock)</button>`;

  showOverlay(`
    <h1>☀️ Daily Challenge</h1>
    <p class="subtitle">${formatDate(today)}</p>

    <div class="streak-display">${streakEmoji} ${d.streak} day streak</div>

    <div class="daily-card">
      <h3>Today's Challenge</h3>
      <p>${DAILY_WORDS} words — a mix of new words and ones that need practice.<br>
      Complete it to unlock a mini game reward!</p>
      <p style="margin-top:0.5rem;color:#556677;">Games today: ${gamesPlayed}</p>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="startDaily()">▶ Start Daily</button>
      ${miniGameBtn}
    </div>
    <div class="btn-row" style="margin-top:0.5rem;">
      <a href="game_word_drop.html" class="btn" style="text-decoration:none;">← Word Drop</a>
    </div>
  `);
}

function getYesterday() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

// ── Start daily game ──────────────────────────────────────────────────────────
function startDaily() {
  dailyQueue = buildDailyQueue();
  tokens = [];
  activeWord = null;
  wordResolved = false;
  score = 0;
  wrongClicks = 0;
  timeouts = 0;
  dailyResults = [];
  sentenceCard = null;
  waitingForSpawn = false;
  consecutiveCorrect = 0;

  hideOverlay();

  if (!gameRunning) {
    gameRunning = true;
    animId = requestAnimationFrame(gameLoop);
  }

  setTimeout(nextWord, 600);
}

// ── Word drop mechanics (same as main game) ───────────────────────────────────
function nextWord() {
  if (dailyQueue.length === 0) {
    finishDaily();
    return;
  }

  activeWord = dailyQueue.shift();
  wordResolved = false;
  waitingForSpawn = true;

  // Delay before spawning tokens (reading time)
  const confusable = activeWord.category === 'confusable';
  const delay = confusable ? 3000 : 1000;
  setTimeout(() => spawnTokens(activeWord), delay);
}

function spawnTokens(wordData) {
  waitingForSpawn = false;
  const speed = BASE_SPEED;
  const W = canvas.width;
  const cols = 5;
  const colW = W / cols;

  // Create 5 tokens: 1 correct + 4 misspellings
  const options = [wordData.word, ...wordData.misspellings.slice(0, 4)];
  shuffle(options);

  ctx.font = TOKEN_FONT;
  tokens = options.map((text, i) => {
    const cx = colW * i + colW / 2;
    const jitter = (Math.random() - 0.5) * colW * 0.3;
    const tw = ctx.measureText(text).width + TOKEN_PAD_X * 2;
    const headerH = 56;
    const wordH = 88;
    const startY = headerH + wordH + TOKEN_H;
    return {
      text,
      isCorrect: text === wordData.word,
      x: Math.max(tw / 2 + 10, Math.min(canvas.width - tw / 2 - 10, cx + jitter)),
      y: startY - i * 60,
      w: tw,
      h: TOKEN_H,
      speed: speed + (Math.random() - 0.5) * 0.3,
      state: 'falling',
      col: i + 1
    };
  });
}

function finishDaily() {
  gameRunning = false;
  if (animId) cancelAnimationFrame(animId);

  const d = daily();
  const today = todayStr();

  // Update daily progress
  if (d.last_played !== today) {
    // First game today
    if (d.last_played === getYesterday()) {
      d.streak++;
    } else {
      d.streak = 1;
    }
    d.total_days++;
    d.games_today = 1;
  } else {
    d.games_today++;
  }
  d.last_played = today;
  d.mini_games_unlocked = d.games_today;

  saveProgress();

  const ok = dailyResults.filter(r => r.success).length;
  const tot = dailyResults.length;

  const items = dailyResults.map(r => {
    return `<span class="word-result ${r.success ? 'ok' : 'err'}">
      ${r.success ? '✓' : '✗'} ${r.word.word}
    </span>`;
  }).join('');

  showOverlay(`
    <h1>☀️ Daily Complete!</h1>
    <div class="stats-row">
      <div class="stat"><div class="val">${ok}</div><div class="lbl">Correct</div></div>
      <div class="stat"><div class="val" style="color:#ee4444">${tot - ok}</div><div class="lbl">Missed</div></div>
      <div class="stat"><div class="val" style="color:#ffcc44">${d.streak}</div><div class="lbl">Day Streak</div></div>
    </div>
    <div style="margin:1rem 0;line-height:2;">${items}</div>
    <div class="btn-row">
      <button class="btn reward" onclick="showMiniGamePicker()">🎮 Play Mini Game!</button>
      <button class="btn" onclick="startDaily()">Play Again</button>
      <button class="btn" onclick="showDailyHome()">Home</button>
    </div>
  `);
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function gameLoop() {
  if (!gameRunning) return;

  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawStars();

  if (miniGameActive) {
    updateMiniGame();
    animId = requestAnimationFrame(gameLoop);
    return;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = 'bold 28px system-ui';
    ctx.fillStyle = '#88ddff';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '16px system-ui';
    ctx.fillStyle = '#556677';
    ctx.fillText('Press Space or P to resume', canvas.width / 2, canvas.height / 2 + 30);
    animId = requestAnimationFrame(gameLoop);
    return;
  }

  // Draw sentence card
  if (sentenceCard) {
    drawSentenceCard();
    animId = requestAnimationFrame(gameLoop);
    return;
  }

  // Update & draw tokens
  for (let i = tokens.length - 1; i >= 0; i--) {
    const t = tokens[i];
    if (t.state === 'falling') {
      t.y += t.speed;
      if (t.y - t.h / 2 > canvas.height + 10) {
        // Token fell off screen — timeout
        if (!wordResolved && t.isCorrect) {
          wordResolved = true;
          timeouts++;
          consecutiveCorrect = 0;
          const s = wordStat(activeWord.word);
          s.streak = 0;
          s.total_errors++;
          s.errors.push({ ts: new Date().toISOString(), type: 'missed', game: 'daily' });
          dailyResults.push({ word: activeWord, success: false, reason: 'timeout' });
          saveProgress();
          // Reveal correct
          tokens.forEach(tk => { if (tk.isCorrect) tk.state = 'reveal'; });
          setTimeout(() => {
            sentenceCard = { word: activeWord.word, sentence: randomSentence(activeWord), success: false, waiting: true };
          }, 800);
        }
      }
    }
    drawToken(t);
  }

  // HUD
  drawHUD();

  animId = requestAnimationFrame(gameLoop);
}

function randomSentence(wordData) {
  if (wordData.sentences && wordData.sentences.length > 0) {
    return wordData.sentences[Math.floor(Math.random() * wordData.sentences.length)];
  }
  return wordData.sentence || '';
}

function drawToken(t) {
  const alpha = t.state === 'fade' ? 0.3 : 1;
  ctx.globalAlpha = alpha;

  let bg = '#0a0a2e', border = '#2a4a88', fg = '#ccddff';
  if (t.state === 'clicked_ok') { bg = '#0a2a0a'; border = '#2a8a2a'; fg = '#88ff88'; }
  if (t.state === 'clicked_err') { bg = '#2a0a0a'; border = '#8a2a2a'; fg = '#ff8888'; }
  if (t.state === 'reveal') { bg = '#0a2a0a'; border = '#2aaa4a'; fg = '#66ff88'; }

  const x = t.x - t.w / 2, y = t.y - t.h / 2;
  ctx.fillStyle = bg;
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x, y, t.w, t.h, 8);
  ctx.fill();
  ctx.stroke();

  ctx.font = TOKEN_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = fg;
  ctx.fillText(t.text, t.x, t.y);

  // Column number
  ctx.font = '10px monospace';
  ctx.fillStyle = '#334466';
  ctx.fillText(t.col, t.x, t.y - t.h / 2 + 10);

  ctx.globalAlpha = 1;
}

function drawHUD() {
  const W = canvas.width;
  const headerH = 56;
  const wordH = 88;

  // Header bar
  ctx.fillStyle = 'rgba(5, 10, 30, 0.9)';
  ctx.fillRect(0, 0, W, headerH);
  ctx.font = 'bold 14px system-ui';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffcc44';
  ctx.fillText('☀️ Daily', 18, headerH / 2);
  ctx.fillStyle = '#88ddff';
  ctx.textAlign = 'center';
  ctx.fillText(`Score  ${score}`, W / 2 - 80, headerH / 2);
  ctx.fillStyle = '#ee8888';
  ctx.fillText(`Miss  ${wrongClicks + timeouts}`, W / 2 + 80, headerH / 2);
  ctx.fillStyle = '#556677';
  ctx.textAlign = 'right';
  ctx.fillText(`${dailyResults.length + 1}/${dailyResults.length + dailyQueue.length + 1}`, W - 18, headerH / 2);

  // Definition hint
  if (activeWord && !wordResolved) {
    ctx.fillStyle = 'rgba(5, 10, 30, 0.85)';
    ctx.fillRect(0, headerH, W, wordH);
    ctx.font = '15px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#aabbcc';
    const def = activeWord.definition || '';
    // Wrap long definitions
    const maxW = W - 40;
    if (ctx.measureText(def).width > maxW) {
      const words = def.split(' ');
      let line = '', lines = [];
      words.forEach(w => {
        const test = line + (line ? ' ' : '') + w;
        if (ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
        else line = test;
      });
      if (line) lines.push(line);
      const lineH = 20;
      const startY = headerH + wordH / 2 - ((lines.length - 1) * lineH) / 2;
      lines.forEach((l, i) => ctx.fillText(l, W / 2, startY + i * lineH));
    } else {
      ctx.fillText(def, W / 2, headerH + wordH / 2);
    }
  }
}

function drawSentenceCard() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0, 5, 15, 0.85)';
  ctx.fillRect(0, 0, W, H);

  const cy = H / 2;
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = sentenceCard.success ? '#66ee88' : '#ee6666';
  ctx.fillText(sentenceCard.word, W / 2, cy - 50);

  ctx.font = '16px system-ui';
  ctx.fillStyle = '#aabbcc';
  // Wrap sentence
  const maxW = W - 60;
  const words = sentenceCard.sentence.split(' ');
  let line = '', lines = [];
  words.forEach(w => {
    const test = line + (line ? ' ' : '') + w;
    if (ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, W / 2, cy + i * 24));

  ctx.font = '13px system-ui';
  ctx.fillStyle = '#556677';
  ctx.fillText('Click or press Space to continue', W / 2, cy + lines.length * 24 + 40);
}

// ── Click handler ─────────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (miniGameActive) { miniGameClick(e); return; }

  if (sentenceCard && sentenceCard.waiting) {
    sentenceCard = null;
    nextWord();
    return;
  }

  if (!activeWord || wordResolved || paused) return;

  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);

  // Ignore clicks in HUD zone
  const headerH = 56, wordH = 88;
  if (my < headerH + wordH) return;

  const leniency = canvas.height * 0.25;

  for (const t of tokens) {
    if (t.state !== 'falling') continue;
    const inX = mx >= t.x - t.w / 2 && mx <= t.x + t.w / 2;
    const inY = Math.abs(my - t.y) < t.h / 2 + leniency;
    if (inX && inY) {
      wordResolved = true;
      if (t.isCorrect) {
        t.state = 'clicked_ok';
        score++;
        consecutiveCorrect++;
        const s = wordStat(activeWord.word);
        s.streak++;
        if (s.streak >= GRAD_STREAK && !s.graduated) {
          s.graduated = true;
          s.graduated_date = new Date().toISOString();
        }
        dailyResults.push({ word: activeWord, success: true });
        tokens.forEach(tk => { if (tk !== t) tk.state = 'fade'; });
      } else {
        t.state = 'clicked_err';
        wrongClicks++;
        consecutiveCorrect = 0;
        const s = wordStat(activeWord.word);
        s.streak = 0;
        s.total_errors++;
        s.errors.push({ ts: new Date().toISOString(), type: 'clicked_wrong', game: 'daily' });
        dailyResults.push({ word: activeWord, success: false, reason: 'wrong' });
        tokens.forEach(tk => { if (tk.isCorrect) tk.state = 'reveal'; if (tk !== t && !tk.isCorrect) tk.state = 'fade'; });
      }
      saveProgress();
      setTimeout(() => {
        sentenceCard = { word: activeWord.word, sentence: randomSentence(activeWord), success: t.isCorrect, waiting: true };
      }, 600);
      return;
    }
  }
});

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (miniGameActive) { miniGameKey(e); return; }

  if (e.code === 'Space' || e.code === 'KeyP') {
    if (sentenceCard && sentenceCard.waiting) {
      sentenceCard = null;
      nextWord();
      return;
    }
    if (gameRunning && !sentenceCard) {
      paused = !paused;
    }
    e.preventDefault();
  }

  // Column shortcuts
  if (e.key >= '1' && e.key <= '5' && gameRunning && !paused && !wordResolved && !sentenceCard && activeWord) {
    const col = parseInt(e.key);
    const t = tokens.find(tk => tk.col === col && tk.state === 'falling');
    if (t) {
      canvas.dispatchEvent(new MouseEvent('click', {
        clientX: t.x, clientY: t.y
      }));
    }
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// ── MINI GAMES ────────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════

function showMiniGamePicker() {
  showOverlay(`
    <h1>🎮 Mini Games</h1>
    <p class="subtitle">Your reward for completing today's challenge!</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin:2rem 0;">
      <div class="mini-game-card" onclick="startMiniGame('stars')">
        <div class="emoji">⭐</div>
        <div class="name">Star Catcher</div>
        <p style="color:#667;font-size:0.75rem;margin-top:0.3rem;">Catch falling stars, avoid meteors</p>
      </div>
      <div class="mini-game-card" onclick="startMiniGame('bounce')">
        <div class="emoji">🏓</div>
        <div class="name">Cosmic Pong</div>
        <p style="color:#667;font-size:0.75rem;margin-top:0.3rem;">Keep the ball bouncing</p>
      </div>
      <div class="mini-game-card" onclick="startMiniGame('snake')">
        <div class="emoji">🐍</div>
        <div class="name">Neon Snake</div>
        <p style="color:#667;font-size:0.75rem;margin-top:0.3rem;">Classic snake with a glow</p>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="showDailyHome()">← Back</button>
    </div>
  `);
}

function startMiniGame(type) {
  miniGameType = type;
  miniGameActive = true;
  hideOverlay();

  if (type === 'stars') initStarCatcher();
  else if (type === 'bounce') initCosmicPong();
  else if (type === 'snake') initNeonSnake();

  if (!gameRunning) {
    gameRunning = true;
    animId = requestAnimationFrame(gameLoop);
  }
}

function endMiniGame(score) {
  miniGameActive = false;
  miniGameType = null;
  gameRunning = false;
  if (animId) cancelAnimationFrame(animId);

  showOverlay(`
    <h1>🎮 Game Over!</h1>
    <div class="stat" style="margin:1.5rem 0;"><div class="val" style="font-size:3rem;">${score}</div><div class="lbl">Score</div></div>
    <div class="btn-row">
      <button class="btn reward" onclick="showMiniGamePicker()">Play Another</button>
      <button class="btn" onclick="showDailyHome()">Home</button>
    </div>
  `);
}

// ── Star Catcher ──────────────────────────────────────────────────────────────
let sc = {};

function initStarCatcher() {
  sc = {
    paddle: { x: canvas.width / 2, w: 80 },
    items: [],
    score: 0,
    lives: 3,
    spawnTimer: 0,
    speed: 2
  };
}

function updateStarCatcher() {
  const W = canvas.width, H = canvas.height;

  // Spawn items
  sc.spawnTimer++;
  if (sc.spawnTimer > 40) {
    sc.spawnTimer = 0;
    const isStar = Math.random() > 0.3;
    sc.items.push({
      x: Math.random() * (W - 40) + 20,
      y: -20,
      type: isStar ? 'star' : 'meteor',
      speed: sc.speed + Math.random() * 1.5
    });
    if (sc.score > 10) sc.speed = 2.5;
    if (sc.score > 25) sc.speed = 3;
  }

  // Update items
  for (let i = sc.items.length - 1; i >= 0; i--) {
    const item = sc.items[i];
    item.y += item.speed;

    // Check paddle catch
    if (item.y > H - 60 && item.y < H - 30) {
      if (Math.abs(item.x - sc.paddle.x) < sc.paddle.w / 2 + 15) {
        if (item.type === 'star') {
          sc.score++;
        } else {
          sc.lives--;
          if (sc.lives <= 0) { endMiniGame(sc.score); return; }
        }
        sc.items.splice(i, 1);
        continue;
      }
    }

    // Off screen
    if (item.y > H + 20) {
      if (item.type === 'star') {
        // Missed star — lose a life
        sc.lives--;
        if (sc.lives <= 0) { endMiniGame(sc.score); return; }
      }
      sc.items.splice(i, 1);
    }
  }

  // Draw
  // Paddle
  ctx.fillStyle = '#4488cc';
  ctx.fillRect(sc.paddle.x - sc.paddle.w / 2, H - 50, sc.paddle.w, 12);
  ctx.shadowBlur = 10; ctx.shadowColor = '#4488cc';
  ctx.fillRect(sc.paddle.x - sc.paddle.w / 2, H - 50, sc.paddle.w, 12);
  ctx.shadowBlur = 0;

  // Items
  sc.items.forEach(item => {
    if (item.type === 'star') {
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⭐', item.x, item.y);
    } else {
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('☄️', item.x, item.y);
    }
  });

  // HUD
  ctx.font = 'bold 16px system-ui';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffcc44';
  ctx.fillText(`⭐ ${sc.score}`, 20, 30);
  ctx.fillStyle = '#ee4444';
  ctx.textAlign = 'right';
  ctx.fillText('❤️'.repeat(sc.lives), W - 20, 30);
}

// ── Cosmic Pong ───────────────────────────────────────────────────────────────
let pong = {};

function initCosmicPong() {
  const W = canvas.width, H = canvas.height;
  pong = {
    paddle: { x: W / 2, w: 100 },
    ball: { x: W / 2, y: H / 2, vx: 3, vy: 3 },
    score: 0,
    speed: 3
  };
}

function updateCosmicPong() {
  const W = canvas.width, H = canvas.height;
  const b = pong.ball;

  // Move ball
  b.x += b.vx;
  b.y += b.vy;

  // Wall bounce
  if (b.x < 10 || b.x > W - 10) b.vx *= -1;
  if (b.y < 10) b.vy *= -1;

  // Paddle bounce
  if (b.y > H - 60 && b.y < H - 45) {
    if (Math.abs(b.x - pong.paddle.x) < pong.paddle.w / 2 + 10) {
      b.vy = -Math.abs(b.vy) - 0.1;
      b.vx += (b.x - pong.paddle.x) / 30;
      pong.score++;
      if (pong.score % 5 === 0) {
        b.vy -= 0.3;
        b.vx *= 1.05;
      }
    }
  }

  // Ball fell off
  if (b.y > H + 20) {
    endMiniGame(pong.score);
    return;
  }

  // Draw paddle
  ctx.fillStyle = '#44cc88';
  ctx.shadowBlur = 10; ctx.shadowColor = '#44cc88';
  ctx.fillRect(pong.paddle.x - pong.paddle.w / 2, H - 50, pong.paddle.w, 12);
  ctx.shadowBlur = 0;

  // Draw ball
  ctx.beginPath();
  ctx.arc(b.x, b.y, 10, 0, Math.PI * 2);
  ctx.fillStyle = '#ffcc44';
  ctx.shadowBlur = 15; ctx.shadowColor = '#ffcc44';
  ctx.fill();
  ctx.shadowBlur = 0;

  // Trail
  ctx.beginPath();
  ctx.arc(b.x - b.vx * 2, b.y - b.vy * 2, 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 204, 68, 0.3)';
  ctx.fill();

  // Score
  ctx.font = 'bold 18px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#88ddff';
  ctx.fillText(`${pong.score}`, W / 2, 35);
}

// ── Neon Snake ────────────────────────────────────────────────────────────────
let snake = {};

function initNeonSnake() {
  const gridSize = 20;
  const cols = Math.floor(canvas.width / gridSize);
  const rows = Math.floor(canvas.height / gridSize);
  const cx = Math.floor(cols / 2);
  const cy = Math.floor(rows / 2);

  snake = {
    gridSize,
    cols, rows,
    body: [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }],
    dir: { x: 1, y: 0 },
    nextDir: { x: 1, y: 0 },
    food: null,
    score: 0,
    timer: 0,
    speed: 8, // frames per move
    gameOver: false
  };
  spawnFood();
}

function spawnFood() {
  const occupied = new Set(snake.body.map(s => `${s.x},${s.y}`));
  let x, y;
  do {
    x = Math.floor(Math.random() * snake.cols);
    y = Math.floor(Math.random() * snake.rows);
  } while (occupied.has(`${x},${y}`));
  snake.food = { x, y };
}

function updateNeonSnake() {
  if (snake.gameOver) return;

  snake.timer++;
  if (snake.timer < snake.speed) {
    drawSnake();
    return;
  }
  snake.timer = 0;

  // Apply direction
  snake.dir = { ...snake.nextDir };

  // Move head
  const head = { x: snake.body[0].x + snake.dir.x, y: snake.body[0].y + snake.dir.y };

  // Wall collision (wrap)
  if (head.x < 0) head.x = snake.cols - 1;
  if (head.x >= snake.cols) head.x = 0;
  if (head.y < 0) head.y = snake.rows - 1;
  if (head.y >= snake.rows) head.y = 0;

  // Self collision
  if (snake.body.some(s => s.x === head.x && s.y === head.y)) {
    snake.gameOver = true;
    endMiniGame(snake.score);
    return;
  }

  snake.body.unshift(head);

  // Food collision
  if (head.x === snake.food.x && head.y === snake.food.y) {
    snake.score++;
    if (snake.score % 5 === 0 && snake.speed > 4) snake.speed--;
    spawnFood();
  } else {
    snake.body.pop();
  }

  drawSnake();
}

function drawSnake() {
  const g = snake.gridSize;

  // Food
  ctx.fillStyle = '#ff4488';
  ctx.shadowBlur = 10; ctx.shadowColor = '#ff4488';
  ctx.beginPath();
  ctx.arc(snake.food.x * g + g / 2, snake.food.y * g + g / 2, g / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Body
  snake.body.forEach((s, i) => {
    const alpha = 1 - (i / snake.body.length) * 0.6;
    ctx.fillStyle = i === 0 ? '#44ffaa' : `rgba(68, 255, 170, ${alpha})`;
    ctx.shadowBlur = i === 0 ? 8 : 0;
    ctx.shadowColor = '#44ffaa';
    ctx.fillRect(s.x * g + 1, s.y * g + 1, g - 2, g - 2);
  });
  ctx.shadowBlur = 0;

  // Score
  ctx.font = 'bold 18px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#88ddff';
  ctx.fillText(`${snake.score}`, canvas.width / 2, 35);
}

// ── Mini game dispatch ────────────────────────────────────────────────────────
function updateMiniGame() {
  if (miniGameType === 'stars') updateStarCatcher();
  else if (miniGameType === 'bounce') updateCosmicPong();
  else if (miniGameType === 'snake') updateNeonSnake();
}

function miniGameClick(e) {
  // Star Catcher and Pong use mouse position for paddle
}

function miniGameKey(e) {
  if (miniGameType === 'snake') {
    const d = snake.dir;
    if ((e.code === 'ArrowUp' || e.code === 'KeyW') && d.y === 0) snake.nextDir = { x: 0, y: -1 };
    if ((e.code === 'ArrowDown' || e.code === 'KeyS') && d.y === 0) snake.nextDir = { x: 0, y: 1 };
    if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && d.x === 0) snake.nextDir = { x: -1, y: 0 };
    if ((e.code === 'ArrowRight' || e.code === 'KeyD') && d.x === 0) snake.nextDir = { x: 1, y: 0 };
    e.preventDefault();
  }
}

// Mouse/touch move for paddle games
canvas.addEventListener('mousemove', e => {
  if (!miniGameActive) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  if (miniGameType === 'stars') sc.paddle.x = mx;
  if (miniGameType === 'bounce') pong.paddle.x = mx;
});

canvas.addEventListener('touchmove', e => {
  if (!miniGameActive) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
  if (miniGameType === 'stars') sc.paddle.x = mx;
  if (miniGameType === 'bounce') pong.paddle.x = mx;
  e.preventDefault();
}, { passive: false });

// Also handle touch for snake (swipe)
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  if (miniGameActive && miniGameType === 'snake') {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
canvas.addEventListener('touchend', e => {
  if (!touchStart || !miniGameActive || miniGameType !== 'snake') return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 20 && snake.dir.x === 0) snake.nextDir = { x: 1, y: 0 };
    else if (dx < -20 && snake.dir.x === 0) snake.nextDir = { x: -1, y: 0 };
  } else {
    if (dy > 20 && snake.dir.y === 0) snake.nextDir = { x: 0, y: 1 };
    else if (dy < -20 && snake.dir.y === 0) snake.nextDir = { x: 0, y: -1 };
  }
});

// ── Error handler ─────────────────────────────────────────────────────────────
window.onerror = function(msg, src, line) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff0000;color:#fff;padding:1rem;z-index:9999;font-size:14px;';
  el.textContent = `Error: ${msg} (line ${line})`;
  document.body.appendChild(el);
};

// ── Init ──────────────────────────────────────────────────────────────────────
loadAll();
</script>
