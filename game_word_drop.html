<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Drop – Vocabulary Builder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
canvas { display: block; }

#overlay {
  position: fixed; inset: 0;
  background: rgba(0, 5, 20, 0.92);
  display: flex; align-items: center; justify-content: center;
  color: #fff; z-index: 10;
}
#overlay.hidden { display: none; }

.screen { text-align: center; max-width: 640px; padding: 2rem; width: 100%; }
.screen h1 { font-size: 2.8rem; color: #88ddff; margin-bottom: 0.4rem; letter-spacing: 2px; }
.screen .subtitle { color: #556677; margin-bottom: 2rem; font-size: 0.95rem; }

.phase-grid {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem;
  margin-bottom: 2rem;
}
.phase-btn {
  padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer;
  font-size: 0.9rem; font-weight: 600; border: 2px solid;
  transition: background 0.15s, transform 0.1s;
  min-width: 100px;
}
.phase-btn:active { transform: scale(0.96); }
.phase-btn.available  { background: #0d2a44; border-color: #2a6a9a; color: #88ccff; }
.phase-btn.available:hover { background: #1a3a5a; }
.phase-btn.completed  { background: #0a2a0a; border-color: #2a7a2a; color: #66ee66; }
.phase-btn.completed:hover { background: #103010; }
.phase-btn.locked     { background: #111; border-color: #333; color: #444; cursor: default; }

.hint-text { color: #445566; font-size: 0.85rem; line-height: 1.5; }

/* Results screen */
.results-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
  max-height: 340px; overflow-y: auto; margin: 1rem 0;
  padding-right: 0.5rem;
}
.results-grid::-webkit-scrollbar { width: 4px; }
.results-grid::-webkit-scrollbar-thumb { background: #334; border-radius: 2px; }
.word-result {
  padding: 0.45rem 0.8rem; border-radius: 6px;
  font-size: 0.85rem; font-weight: 600; text-align: left;
}
.word-result.ok  { background: #0a2a0a; border: 1px solid #2a6a2a; color: #88ee88; }
.word-result.err { background: #2a0a0a; border: 1px solid #6a2a2a; color: #ee8888; }
.word-result .streak-badge {
  font-size: 0.7rem; color: #aaa; margin-left: 0.4rem;
}

.btn-row { display: flex; gap: 0.8rem; justify-content: center; margin-top: 1.2rem; flex-wrap: wrap; }
.btn {
  padding: 0.65rem 1.6rem; border-radius: 8px;
  background: #0d2a44; border: 2px solid #2a6a9a;
  color: #88ccff; cursor: pointer; font-size: 0.95rem; font-weight: 600;
  transition: background 0.15s;
}
.btn:hover { background: #1a3a5a; }
.btn.primary { background: #114422; border-color: #2a8a4a; color: #66ee88; }
.btn.primary:hover { background: #1a5530; }

.stats-row { display: flex; gap: 2rem; justify-content: center; margin-bottom: 1rem; }
.stat { text-align: center; }
.stat .val { font-size: 2rem; font-weight: 700; color: #88ddff; }
.stat .lbl { font-size: 0.8rem; color: #556677; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="overlay">
  <div class="screen" id="screen-loading">
    <h1>Word Drop</h1>
    <p class="subtitle">Loading…</p>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const WORDS_PER_PHASE = 10;
const GRAD_STREAK     = 3;    // consecutive correct answers to graduate a word
const REVIEW_STREAK   = 1;    // correct answers needed to re-confirm mastery
const COOLDOWN_DAYS   = 30;   // days before a graduated word can reappear
const TOKEN_FONT      = 'bold 17px monospace';
const TOKEN_H         = 38;
const TOKEN_PAD_X     = 14;
const BASE_SPEED      = 1.4;  // px per frame at phase 1
const SPEED_INC       = 0.18; // extra px per phase
const SPEED_OPTIONS   = [
  { label: 'Beginner', multiplier: 0.8 },
  { label: 'Normal',   multiplier: 1.0 },
  { label: 'Advanced', multiplier: 1.2 },
];
let speedMultiplier   = 1.0;  // current speed setting

// ── Badge system ──────────────────────────────────────────────────────────────
const BADGES = [
  { id: 'first_steps',    emoji: '🌟', name: 'First Steps',          desc: 'Complete your first phase' },
  { id: 'on_fire',        emoji: '🔥', name: 'On Fire',              desc: 'Get 10 words correct in a row' },
  { id: 'perfect_phase',  emoji: '💯', name: 'Perfect Phase',        desc: 'Score 10/10 on any phase' },
  { id: 'scholar',        emoji: '🎓', name: 'Scholar',              desc: 'Master 50 words' },
  { id: 'word_master',    emoji: '🏆', name: 'Word Master',          desc: 'Master 100 words' },
  { id: 'lexicon_legend', emoji: '📚', name: 'Lexicon Legend',       desc: 'Master all words' },
  { id: 'speed_demon',    emoji: '⚡', name: 'Speed Demon',          desc: 'Score 8+ on Advanced speed' },
  { id: 'confusable_ace', emoji: '🧠', name: 'Confusable Conqueror', desc: 'Master all confusable words' },
  { id: 'consistent',     emoji: '📅', name: 'Consistent',           desc: 'Play 7 days in a row' },
  { id: 'reviewer',       emoji: '🔄', name: 'Reviewer',             desc: 'Re-confirm 10 words in review' },
];

let pendingBadge = null;  // badge to show as notification
let consecutiveCorrect = 0;  // track streak across words in a session

// ── Sound system ──────────────────────────────────────────────────────────────
let soundEnabled = true;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', volume = 0.3) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch {}
}

function playCorrectSound() {
  playTone(523, 0.1, 'sine', 0.25);  // C5
  setTimeout(() => playTone(659, 0.1, 'sine', 0.25), 80);  // E5
  setTimeout(() => playTone(784, 0.15, 'sine', 0.2), 160); // G5
}

function playWrongSound() {
  playTone(200, 0.2, 'sawtooth', 0.15);
  setTimeout(() => playTone(150, 0.3, 'sawtooth', 0.12), 150);
}

function playTimeoutSound() {
  playTone(300, 0.4, 'triangle', 0.15);
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Starfield (decorative) ────────────────────────────────────────────────────
const STARS = Array.from({ length: 120 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.4 + 0.2,
  a: Math.random() * 0.5 + 0.1,
}));

function drawStars() {
  STARS.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${s.a})`;
    ctx.fill();
  });
}

// ── Data & progress ───────────────────────────────────────────────────────────
let allWords = [];
let progress = {};

function wd() { return progress.word_drop; }

function initProgress() {
  if (!progress.word_drop) progress.word_drop = {};
  const d = progress.word_drop;
  if (!d.word_stats)     d.word_stats     = {};
  if (!d.best_scores)    d.best_scores    = {};  // { phase_index: best_score }
  if (d.current_phase == null) d.current_phase = 0;
  if (d.speed_multiplier != null) speedMultiplier = d.speed_multiplier;
  if (d.sound_enabled != null) soundEnabled = d.sound_enabled;
}

function wordStat(word) {
  const stats = wd().word_stats;
  if (!stats[word]) stats[word] = {
    streak: 0,
    total_errors: 0,
    graduated: false,
    graduated_date: null,  // ISO date string when graduated
    review_mode: false,    // true when word returns after cooldown
    errors: []
  };
  return stats[word];
}

// ── Spaced repetition helpers ─────────────────────────────────────────────────
function daysSince(isoDate) {
  if (!isoDate) return Infinity;
  return (Date.now() - new Date(isoDate).getTime()) / (1000 * 60 * 60 * 24);
}

function isEligibleForReview(stat) {
  return stat.graduated && stat.graduated_date && daysSince(stat.graduated_date) >= COOLDOWN_DAYS;
}

async function loadAll() {
  try {
    const [dr, pr] = await Promise.all([fetch('/api/data'), fetch('/api/progress')]);
    allWords = await dr.json();
    const loaded = await pr.json();
    if (loaded) Object.assign(progress, loaded);
    initProgress();
    showPhaseSelect();
  } catch (e) {
    document.getElementById('screen-loading').innerHTML =
      `<h1 style="color:#ff4444">Error</h1><p style="color:#aaa">${e.message}</p>
       <p style="color:#667;margin-top:1rem;font-size:.85rem">Make sure game_server.py is running.</p>`;
  }
}

async function saveProgress() {
  try {
    await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(progress),
    });
  } catch {}
}

// ── Phase helpers ─────────────────────────────────────────────────────────────
const numPhases = () => Math.ceil(allWords.length / WORDS_PER_PHASE);

function phaseState(p) {
  if (p > wd().current_phase) return 'locked';
  if (p < wd().current_phase) return 'completed';
  return 'available';
}

function buildWordQueue(phase) {
  const start = phase * WORDS_PER_PHASE;
  const end   = Math.min(start + WORDS_PER_PHASE, allWords.length);
  const fresh = allWords.slice(start, end).filter(w => {
    const s = wd().word_stats[w.word];
    // Include if never seen or not graduated
    return !s || !s.graduated;
  });

  // Review: ungraduated words from earlier phases that had errors
  const review = allWords.slice(0, start).filter(w => {
    const s = wd().word_stats[w.word];
    return s && s.total_errors > 0 && !s.graduated;
  });

  // Spaced repetition: graduated words past their cooldown period
  const spacedReview = allWords.filter(w => {
    const s = wd().word_stats[w.word];
    return s && isEligibleForReview(s);
  });

  // Mark spaced review words so we know they only need 1 correct
  spacedReview.forEach(w => {
    const s = wordStat(w.word);
    s.review_mode = true;
  });

  const combined = [...fresh, ...review, ...spacedReview];
  shuffle(combined);
  return combined;
}

// ── UI helpers ────────────────────────────────────────────────────────────────
const overlay = document.getElementById('overlay');

function showOverlay(html) {
  overlay.innerHTML = html;
  overlay.classList.remove('hidden');
}

function hideOverlay() {
  overlay.classList.add('hidden');
}

// ── Speed selector ────────────────────────────────────────────────────────────
function setSpeed(multiplier) {
  speedMultiplier = multiplier;
  wd().speed_multiplier = multiplier;
  saveProgress();
  showPhaseSelect();  // re-render to update active button
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  wd().sound_enabled = soundEnabled;
  saveProgress();
  showPhaseSelect();
}

// ── Badge system logic ────────────────────────────────────────────────────────
function earnedBadges() {
  return wd().badges || [];
}

function hasBadge(id) {
  return earnedBadges().includes(id);
}

function awardBadge(id) {
  if (hasBadge(id)) return;
  if (!wd().badges) wd().badges = [];
  wd().badges.push(id);
  wd().badge_dates = wd().badge_dates || {};
  wd().badge_dates[id] = new Date().toISOString();
  saveProgress();
  pendingBadge = BADGES.find(b => b.id === id);
}

function checkBadges(phaseResults, phase) {
  const stats = wd().word_stats || {};
  const mastered = Object.values(stats).filter(s => s.graduated).length;
  const ok = phaseResults.filter(r => r.success).length;

  // First Steps: complete any phase
  if (phaseResults.length > 0) awardBadge('first_steps');

  // Perfect Phase: 10/10
  if (ok === 10 && phaseResults.length === 10) awardBadge('perfect_phase');

  // On Fire: 10 consecutive correct (tracked via consecutiveCorrect)
  // (checked per-word in resolveWord)

  // Scholar: 50 mastered
  if (mastered >= 50) awardBadge('scholar');

  // Word Master: 100 mastered
  if (mastered >= 100) awardBadge('word_master');

  // Lexicon Legend: all mastered
  if (mastered >= allWords.length) awardBadge('lexicon_legend');

  // Speed Demon: 8+ correct on Advanced (1.2x)
  if (speedMultiplier >= 1.2 && ok >= 8) awardBadge('speed_demon');

  // Confusable Conqueror: all confusable words mastered
  const confusables = allWords.filter(w => w.category === 'confusable');
  const confMastered = confusables.every(w => stats[w.word] && stats[w.word].graduated);
  if (confusables.length > 0 && confMastered) awardBadge('confusable_ace');

  // Consistent: 7 days in a row (track play dates)
  recordPlayDate();
  if (getConsecutiveDays() >= 7) awardBadge('consistent');

  // Reviewer: 10 words re-confirmed in review
  const reviewCount = Object.values(stats).filter(s => s.graduated && s.review_mode === false && s.graduated_date).length;
  // Simpler: count words that have been graduated more than once (re-confirmed)
  // We'll track this separately
  const reconfirmed = wd().reconfirmed || 0;
  if (reconfirmed >= 10) awardBadge('reviewer');
}

function recordPlayDate() {
  if (!wd().play_dates) wd().play_dates = [];
  const today = new Date().toISOString().split('T')[0];
  const dates = wd().play_dates;
  if (dates[dates.length - 1] !== today) {
    dates.push(today);
    // Keep last 30 days only
    if (dates.length > 30) dates.splice(0, dates.length - 30);
  }
}

function getConsecutiveDays() {
  const dates = wd().play_dates || [];
  if (dates.length === 0) return 0;
  let streak = 1;
  for (let i = dates.length - 1; i > 0; i--) {
    const curr = new Date(dates[i]);
    const prev = new Date(dates[i - 1]);
    const diff = (curr - prev) / (1000 * 60 * 60 * 24);
    if (diff === 1) streak++;
    else break;
  }
  return streak;
}

function drawBadgeNotification() {
  if (!pendingBadge) return;
  const W = canvas.width, H = canvas.height;
  const nw = 320, nh = 100;
  const nx = (W - nw) / 2, ny = 80;

  ctx.fillStyle = 'rgba(10, 20, 50, 0.95)';
  ctx.strokeStyle = '#ffcc44';
  ctx.lineWidth = 2;
  ctx.fillRect(nx, ny, nw, nh);
  ctx.strokeRect(nx, ny, nw, nh);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 14px system-ui';
  ctx.fillStyle = '#ffcc44';
  ctx.fillText('🏅 Badge Earned!', W / 2, ny + 24);

  ctx.font = '24px system-ui';
  ctx.fillText(`${pendingBadge.emoji} ${pendingBadge.name}`, W / 2, ny + 55);

  ctx.font = '11px system-ui';
  ctx.fillStyle = '#8899aa';
  ctx.fillText(pendingBadge.desc, W / 2, ny + 82);
}

// ── Phase select screen ───────────────────────────────────────────────────────
function showPhaseSelect() {
  const np = numPhases();
  const bestScores = wd().best_scores || {};
  let totalBest = 0;
  let btns = '';
  for (let i = 0; i < np; i++) {
    const st  = phaseState(i);
    const ico = st === 'completed' ? '✓ ' : st === 'locked' ? '🔒 ' : '';
    const best = bestScores[i] != null ? `  ★${bestScores[i]}` : '';
    if (bestScores[i] != null) totalBest += bestScores[i];
    // Show words covered in this phase
    const start = i * WORDS_PER_PHASE;
    const end = Math.min(start + WORDS_PER_PHASE, allWords.length);
    const words = allWords.slice(start, end).map(w => w.word).join(', ');
    btns += `<button class="phase-btn ${st}" ${st === 'locked' ? 'disabled' : ''}
               onclick="startPhase(${i})" title="${words}">${ico}Phase ${i + 1}${best}</button>`;
  }

  const totalLine = totalBest > 0
    ? `<p style="color:#ffcc44;font-size:0.95rem;margin-bottom:1.5rem;">Total Best Score: ★${totalBest}</p>` : '';

  // Speed selector
  const speedBtns = SPEED_OPTIONS.map(opt => {
    const active = opt.multiplier === speedMultiplier;
    const style = active
      ? 'background:#1a3a5a;border-color:#88ccff;color:#88ccff'
      : 'background:#0a1020;border-color:#1a2a44;color:#556677';
    return `<button onclick="setSpeed(${opt.multiplier})" style="padding:0.4rem 0.9rem;border-radius:6px;border:2px solid;cursor:pointer;font-size:0.82rem;font-weight:600;${style};transition:all 0.15s;">${opt.label} (${opt.multiplier}x)</button>`;
  }).join('');

  // Sound toggle
  const soundStyle = soundEnabled
    ? 'background:#1a3a5a;border-color:#88ccff;color:#88ccff'
    : 'background:#0a1020;border-color:#1a2a44;color:#556677';
  const soundBtn = `<button onclick="toggleSound()" style="padding:0.4rem 0.9rem;border-radius:6px;border:2px solid;cursor:pointer;font-size:0.82rem;font-weight:600;${soundStyle};transition:all 0.15s;margin-left:1rem;">${soundEnabled ? '🔊 Sound On' : '🔇 Sound Off'}</button>`;

  showOverlay(`
    <div class="screen">
      <h1>Word Drop</h1>
      <p class="subtitle">Words fall from the sky — click the correctly spelled one!</p>
      ${totalLine}
      <div style="margin-bottom:1.5rem;">
        <span style="color:#556677;font-size:0.82rem;margin-right:0.6rem;">Speed:</span>${speedBtns}${soundBtn}
      </div>
      <div class="phase-grid">${btns}</div>
      <div id="phase-words" style="color:#667;font-size:0.8rem;margin-bottom:1rem;min-height:2.5rem;line-height:1.6;"></div>
      <p class="hint-text">
        Each word needs <strong style="color:#88ddff">${GRAD_STREAK}</strong> correct picks in a row to master.<br>
        Mastered words return after ${COOLDOWN_DAYS} days for a quick review.<br>
        <span style="color:#556677">Hover a phase to see its words.</span>
      </p>
      <div style="margin-top:1.2rem;">
        <button class="btn" onclick="showStats()" style="font-size:0.85rem;padding:0.5rem 1.2rem;">📊 Stats</button>
      </div>
    </div>
  `);

  // Add hover listeners to show words for each phase
  document.querySelectorAll('.phase-btn').forEach((btn, i) => {
    btn.addEventListener('mouseenter', () => {
      const start = i * WORDS_PER_PHASE;
      const end = Math.min(start + WORDS_PER_PHASE, allWords.length);
      const words = allWords.slice(start, end).map(w => w.word).join(', ');
      document.getElementById('phase-words').textContent = `Phase ${i + 1}: ${words}`;
    });
    btn.addEventListener('mouseleave', () => {
      document.getElementById('phase-words').textContent = '';
    });
  });
}

// ── Results screen ────────────────────────────────────────────────────────────
function showResults(phase, results) {
  const ok  = results.filter(r => r.success).length;
  const wrong = results.filter(r => r.reason === 'wrong_click').length;
  const timed = results.filter(r => r.reason === 'timeout').length;
  const tot = results.length;

  // Save best score for this phase
  if (!wd().best_scores) wd().best_scores = {};
  const prev = wd().best_scores[phase] || 0;
  const isNewBest = ok > prev;
  if (isNewBest) wd().best_scores[phase] = ok;

  // Unlock next phase if all words were seen at least once
  if (phase === wd().current_phase && phase + 1 < numPhases()) {
    wd().current_phase = phase + 1;
  }

  // Check for badge achievements
  checkBadges(results, phase);
  saveProgress();

  const bestTag = isNewBest ? `<span style="color:#ffcc44;font-size:0.85rem;"> ★ New Best!</span>` : '';
  const prevBest = prev > 0 ? `<div class="stat"><div class="val" style="color:#ffcc44">★${wd().best_scores[phase]}</div><div class="lbl">Best</div></div>` : '';

  const items = results.map(r => {
    const s    = wordStat(r.word.word);
    const grad = s.graduated ? ' 🎓' : '';
    const badge = `<span class="streak-badge">(streak: ${s.streak})</span>`;
    return `<div class="word-result ${r.success ? 'ok' : 'err'}">
      ${r.success ? '✓' : r.reason === 'timeout' ? '⏱' : '✗'} ${r.word.word}${grad}${badge}
    </div>`;
  }).join('');

  const nextBtn = phase + 1 < numPhases()
    ? `<button class="btn primary" onclick="startPhase(${phase + 1})">Next Phase →</button>` : '';

  showOverlay(`
    <div class="screen">
      <h1>Phase ${phase + 1} Done${bestTag}</h1>
      <div class="stats-row">
        <div class="stat"><div class="val">${ok}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="val" style="color:#ee4444">${wrong}</div><div class="lbl">Wrong</div></div>
        <div class="stat"><div class="val" style="color:#cc8844">${timed}</div><div class="lbl">Timeout</div></div>
        <div class="stat"><div class="val">${tot}</div><div class="lbl">Total</div></div>
        ${prevBest}
      </div>
      <div class="results-grid">${items}</div>
      <div class="btn-row">
        <button class="btn" onclick="startPhase(${phase})">Replay</button>
        ${nextBtn}
        <button class="btn" onclick="showPhaseSelect()">Phases</button>
      </div>
    </div>
  `);
}

// ── Stats dashboard ───────────────────────────────────────────────────────────
function showStats() {
  const stats = wd().word_stats || {};
  const words = Object.keys(stats);
  const totalWords = allWords.length;
  const mastered = words.filter(w => stats[w].graduated).length;
  const totalAttempts = words.reduce((sum, w) => {
    const s = stats[w];
    return sum + s.streak + s.total_errors;
  }, 0);
  const totalCorrect = words.reduce((sum, w) => {
    // Approximate: total attempts - errors
    const s = stats[w];
    return sum + (s.streak + s.total_errors) - s.total_errors;
  }, 0);
  const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

  // Most missed words (top 10 by error count)
  const mostMissed = words
    .filter(w => stats[w].total_errors > 0)
    .sort((a, b) => stats[b].total_errors - stats[a].total_errors)
    .slice(0, 10);

  // Current streaks (top 10)
  const topStreaks = words
    .filter(w => stats[w].streak > 0)
    .sort((a, b) => stats[b].streak - stats[a].streak)
    .slice(0, 10);

  // Best scores
  const bestScores = wd().best_scores || {};
  const totalBest = Object.values(bestScores).reduce((a, b) => a + b, 0);

  const missedHtml = mostMissed.length > 0
    ? mostMissed.map(w => `<span style="display:inline-block;background:#2a0a0a;border:1px solid #4a1a1a;border-radius:6px;padding:0.2rem 0.6rem;margin:0.2rem;font-size:0.82rem;color:#ee8888;">${w} (${stats[w].total_errors})</span>`).join('')
    : '<span style="color:#556677;">None yet!</span>';

  const streakHtml = topStreaks.length > 0
    ? topStreaks.map(w => `<span style="display:inline-block;background:#0a2a0a;border:1px solid #2a6a2a;border-radius:6px;padding:0.2rem 0.6rem;margin:0.2rem;font-size:0.82rem;color:#88ee88;">${w} (${stats[w].streak})</span>`).join('')
    : '<span style="color:#556677;">No active streaks</span>';

  // Badges
  const earned = earnedBadges();
  const badgesHtml = BADGES.map(b => {
    const unlocked = earned.includes(b.id);
    const style = unlocked
      ? 'background:#1a2a10;border:1px solid #4a8a2a;color:#88ee88'
      : 'background:#111;border:1px solid #222;color:#333';
    return `<span style="display:inline-block;border-radius:8px;padding:0.3rem 0.7rem;margin:0.2rem;font-size:0.82rem;${style};" title="${b.desc}">${b.emoji} ${b.name}</span>`;
  }).join('');

  showOverlay(`
    <div class="screen">
      <h1>📊 Stats</h1>
      <div class="stats-row" style="margin-bottom:2rem;">
        <div class="stat"><div class="val">${mastered}</div><div class="lbl">Mastered</div></div>
        <div class="stat"><div class="val">${totalWords - mastered}</div><div class="lbl">Remaining</div></div>
        <div class="stat"><div class="val">${accuracy}%</div><div class="lbl">Accuracy</div></div>
        <div class="stat"><div class="val" style="color:#ffcc44">★${totalBest}</div><div class="lbl">Total Best</div></div>
      </div>
      <div style="text-align:left;margin-bottom:1.5rem;">
        <div style="color:#cc6666;font-size:0.8rem;font-weight:700;letter-spacing:1px;margin-bottom:0.5rem;">MOST MISSED</div>
        <div style="line-height:2;">${missedHtml}</div>
      </div>
      <div style="text-align:left;margin-bottom:1.5rem;">
        <div style="color:#66cc66;font-size:0.8rem;font-weight:700;letter-spacing:1px;margin-bottom:0.5rem;">TOP STREAKS</div>
        <div style="line-height:2;">${streakHtml}</div>
      </div>
      <div style="text-align:left;margin-bottom:1.5rem;">
        <div style="color:#ffcc44;font-size:0.8rem;font-weight:700;letter-spacing:1px;margin-bottom:0.5rem;">BADGES (${earned.length}/${BADGES.length})</div>
        <div style="line-height:2;">${badgesHtml}</div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="showPhaseSelect()">← Back</button>
      </div>
    </div>
  `);
}

// ── Game state ────────────────────────────────────────────────────────────────
let currentPhase   = 0;
let wordQueue      = [];
let activeWord     = null;
let tokens         = [];
let wordResolved   = false;
let score          = 0;
let wrongClicks    = 0;
let timeouts       = 0;
let phaseResults   = [];
let animId         = null;
let gameRunning    = false;
let paused         = false;

// Sentence card state (shown between words)
let sentenceCard   = null;  // { word, sentence, success, waiting: true }

// ── Start phase ───────────────────────────────────────────────────────────────
function startPhase(phase) {
  currentPhase  = phase;
  score         = 0;
  wrongClicks   = 0;
  timeouts      = 0;
  phaseResults  = [];
  wordQueue     = buildWordQueue(phase);
  tokens        = [];
  activeWord    = null;
  wordResolved  = false;
  sentenceCard  = null;
  pendingBadge  = null;

  hideOverlay();

  if (!gameRunning) {
    gameRunning = true;
    animId = requestAnimationFrame(gameLoop);
  }

  setTimeout(nextWord, 600);
}

function nextWord() {
  tokens       = [];
  activeWord   = null;
  wordResolved = false;

  if (wordQueue.length === 0) {
    gameRunning = false;
    cancelAnimationFrame(animId);
    showResults(currentPhase, phaseResults);
    return;
  }

  const wordData = wordQueue.shift();
  // Show the definition banner immediately, delay token spawn so player can read
  activeWord = wordData;
  const isConfusable = wordData.category === 'confusable';
  const delay = isConfusable ? 3000 : 1000;
  setTimeout(() => {
    if (activeWord === wordData && !wordResolved) {
      spawnTokens(wordData);
    }
  }, delay);
}

// ── Spawn tokens ──────────────────────────────────────────────────────────────
function spawnTokens(wordData) {

  const texts = shuffle([wordData.word, ...wordData.misspellings]);
  const speed = (BASE_SPEED + currentPhase * SPEED_INC) * speedMultiplier;

  ctx.font = TOKEN_FONT;

  // Distribute across 5 columns with slight random offset
  const cols     = texts.length;       // 5
  const margin   = 60;
  const colWidth = (canvas.width - margin * 2) / cols;

  tokens = texts.map((text, i) => {
    const tw = ctx.measureText(text).width + TOKEN_PAD_X * 2;
    const cx = margin + i * colWidth + colWidth / 2;
    const jitter = (Math.random() - 0.5) * colWidth * 0.4;
    const headerH = 56;
    const wordH = 88;
    const startY = headerH + wordH + TOKEN_H;  // just below the HUD banner
    return {
      text,
      isCorrect: text === wordData.word,
      x: Math.max(tw / 2 + 10, Math.min(canvas.width - tw / 2 - 10, cx + jitter)),
      y: startY + Math.random() * 20,
      w: tw,
      h: TOKEN_H,
      speed: speed + (Math.random() - 0.5) * 0.3,
      state: 'falling',  // falling | clicked_ok | clicked_err | fade
      alpha: 1.0,
      scale: 1.0,
    };
  });
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function gameLoop() {
  if (!gameRunning) return;
  animId = requestAnimationFrame(gameLoop);

  // Background
  ctx.fillStyle = '#03050f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawStars();

  // If paused, draw tokens frozen and show pause overlay
  if (paused) {
    tokens.forEach(t => drawToken(t));
    updateAndDrawRipples();
    drawHUD();
    // Pause overlay
    ctx.fillStyle = 'rgba(0, 5, 20, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#88ddff';
    ctx.font = 'bold 48px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#556677';
    ctx.font = '16px system-ui';
    ctx.fillText('Press Space or P to resume', canvas.width / 2, canvas.height / 2 + 30);
    return;
  }

  // Update tokens
  for (let i = tokens.length - 1; i >= 0; i--) {
    const t = tokens[i];

    if (t.state === 'falling') {
      t.y += t.speed;
      if (t.y - t.h / 2 > canvas.height + 10) {
        // The correct token escaped — that's a timeout
        if (t.isCorrect && !wordResolved) {
          resolveWord(false, 'timeout');
        }
        tokens.splice(i, 1);
        continue;
      }
    } else if (t.state === 'clicked_ok' || t.state === 'clicked_err') {
      // Clicked tokens: scale pop then fade
      if (t.scale < 1.3) {
        t.scale += 0.06;
      } else {
        t.alpha -= 0.025;
      }
      if (t.alpha <= 0) { tokens.splice(i, 1); continue; }
    } else if (t.state === 'reveal') {
      // Reveal correct answer: pulse then slow fade
      if (t.scale < 1.4) {
        t.scale += 0.04;
      } else {
        t.alpha -= 0.015;
      }
      if (t.alpha <= 0) { tokens.splice(i, 1); continue; }
    } else {
      // Regular fade for non-clicked tokens
      t.alpha -= 0.045;
      if (t.alpha <= 0) { tokens.splice(i, 1); continue; }
    }

    drawToken(t);
  }

  // Check if word should auto-resolve (all tokens gone without click)
  if (activeWord && !wordResolved && tokens.length === 0) {
    resolveWord(false, 'timeout');
  }

  // Draw click ripples
  updateAndDrawRipples();

  // HUD on top
  drawHUD();

  // Sentence card overlay (shown between words)
  if (sentenceCard && sentenceCard.waiting) {
    drawSentenceCard();
    drawBadgeNotification();
  }
}

function resolveWord(success, reason) {
  if (wordResolved) return;
  wordResolved = true;

  const s = wordStat(activeWord.word);

  if (success) {
    playCorrectSound();
    s.streak++;
    consecutiveCorrect++;
    if (consecutiveCorrect >= 10) awardBadge('on_fire');
    const needed = s.review_mode ? REVIEW_STREAK : GRAD_STREAK;
    if (s.streak >= needed) {
      if (s.review_mode) {
        wd().reconfirmed = (wd().reconfirmed || 0) + 1;
      }
      s.graduated = true;
      s.graduated_date = new Date().toISOString();
      s.review_mode = false;
    }
  } else {
    consecutiveCorrect = 0;
    s.streak = 0;
    s.total_errors++;
    s.graduated = false;
    s.graduated_date = null;
    s.review_mode = false;
    const errorType = reason || 'timeout';
    s.errors.push({ ts: new Date().toISOString(), type: errorType, game: 'word_drop' });
    if (errorType === 'wrong_click') {
      wrongClicks++;
      playWrongSound();
    } else {
      timeouts++;
      playTimeoutSound();
    }
    // Reveal the correct token — highlight it green briefly
    tokens.forEach(t => {
      if (t.isCorrect && t.state === 'falling') {
        t.state = 'reveal';
        t.scale = 1.0;
      }
    });
  }
  saveProgress();

  phaseResults.push({ word: activeWord, success, reason: success ? null : (reason || 'timeout') });

  // Show sentence card after a brief delay for token animation
  const resolvedWord = activeWord;
  activeWord = null;

  setTimeout(() => {
    sentenceCard = {
      word: resolvedWord.word,
      sentence: pickSentence(resolvedWord),
      success,
      waiting: true,
    };
  }, success ? 600 : 1200);
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawToken(t) {
  ctx.save();
  ctx.globalAlpha = t.alpha;

  const scale = t.scale || 1.0;

  let bg, border, fg;
  switch (t.state) {
    case 'falling':
      // All tokens look the same — uniform style
      bg = '#0a0a2e'; border = '#2a4a88'; fg = '#ccddff';
      break;
    case 'clicked_ok':
      bg = '#003300'; border = '#00ff44'; fg = '#00ff88'; break;
    case 'clicked_err':
      bg = '#330000'; border = '#ff2222'; fg = '#ff4444'; break;
    case 'reveal':
      bg = '#002a00'; border = '#44ff88'; fg = '#88ffbb'; break;
    default:
      bg = '#111'; border = '#333'; fg = '#777';
  }

  // Apply scale transform around token center
  ctx.translate(t.x, t.y);
  ctx.scale(scale, scale);
  ctx.translate(-t.x, -t.y);

  ctx.fillStyle   = bg;
  ctx.strokeStyle = border;
  ctx.lineWidth   = (t.state === 'clicked_ok' || t.state === 'clicked_err' || t.state === 'reveal') ? 3 : 2;
  pill(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h, 9);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle    = fg;
  ctx.font         = TOKEN_FONT;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t.text, t.x, t.y);

  ctx.restore();
}

function drawHUD() {
  const W = canvas.width;
  const H = canvas.height;
  const headerH = 56;
  const wordH   = 88;
  const footerH = 54;

  // ── Header ─────────────────────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(2, 6, 18, 0.88)';
  ctx.fillRect(0, 0, W, headerH);

  ctx.font         = 'bold 15px system-ui';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#4488cc';
  ctx.textAlign = 'left';
  ctx.fillText(`Phase ${currentPhase + 1}`, 18, headerH / 2);

  ctx.fillStyle = '#44cc44';
  ctx.textAlign = 'center';
  ctx.fillText(`Score  ${score}`, W / 2 - 100, headerH / 2);

  ctx.fillStyle = '#cc4444';
  ctx.fillText(`Wrong  ${wrongClicks}`, W / 2 + 40, headerH / 2);

  ctx.fillStyle = '#cc8844';
  ctx.fillText(`Timeout  ${timeouts}`, W / 2 + 160, headerH / 2);

  ctx.fillStyle = '#446688';
  ctx.textAlign = 'right';
  ctx.fillText(`Words left  ${wordQueue.length + (activeWord ? 1 : 0)}`, W - 18, headerH / 2);

  // ── Active word banner ─────────────────────────────────────────────────────
  if (activeWord) {
    ctx.fillStyle = 'rgba(2, 8, 24, 0.88)';
    ctx.fillRect(0, headerH, W, wordH);

    const isConfusable = activeWord.category === 'confusable';

    ctx.fillStyle = isConfusable ? '#ffaa44' : '#556677';
    ctx.font      = isConfusable ? 'bold 12px system-ui' : '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(
      isConfusable ? '⚠️ CONFUSABLE — Read carefully! ↓' : 'Find the correct spelling ↓',
      W / 2, headerH + 16
    );

    // Show definition as the hint (not the correct spelling!)
    ctx.fillStyle    = isConfusable ? '#ccaa66' : '#8899aa';
    ctx.font         = 'italic 15px system-ui';
    ctx.textBaseline = 'middle';
    const defText = activeWord.definition || '';
    const maxW = W - 80;
    const truncated = truncateText(defText, maxW);
    ctx.fillText(truncated, W / 2, headerH + 44);

    const s = wordStat(activeWord.word);
    const needed = s.review_mode ? REVIEW_STREAK : GRAD_STREAK;
    const streakInfo = s.streak > 0 ? `Streak: ${s.streak}/${needed}` : '';
    if (streakInfo) {
      ctx.fillStyle = '#ffaa44';
      ctx.font      = '12px system-ui';
      ctx.fillText(streakInfo, W / 2, headerH + wordH - 14);
    }
  }

  // ── Column numbers on tokens ───────────────────────────────────────────────
  if (activeWord && !wordResolved) {
    const falling = tokens.filter(t => t.state === 'falling').sort((a, b) => a.x - b.x);
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#556688';
    falling.forEach((t, i) => {
      ctx.fillText(`${i + 1}`, t.x, t.y - t.h / 2 - 4);
    });
  }

  // ── Footer ─────────────────────────────────────────────────────────────────
  if (activeWord) {
    ctx.fillStyle = 'rgba(2, 6, 18, 0.88)';
    ctx.fillRect(0, H - footerH, W, footerH);

    ctx.fillStyle    = '#334455';
    ctx.font         = 'bold 11px system-ui';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    const s = wordStat(activeWord.word);
    const reviewTag = s.review_mode ? '  [Review]' : '';
    ctx.fillText(`Click the correctly spelled word${reviewTag}`, W / 2, H - footerH / 2);

    // Pause hint
    ctx.textAlign = 'right';
    ctx.fillStyle = '#334455';
    ctx.fillText('Space: pause  H: help', W - 16, H - footerH / 2);
  }

  // ── Help panel ─────────────────────────────────────────────────────────────
  if (showHelp) {
    const pw = 260, ph = 180;
    const px = W - pw - 16, py = headerH + wordH + 10;
    ctx.fillStyle = 'rgba(5, 10, 30, 0.95)';
    ctx.strokeStyle = '#2a4a6a';
    ctx.lineWidth = 1;
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeRect(px, py, pw, ph);

    ctx.fillStyle = '#88ccff';
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('Keyboard Shortcuts', px + 12, py + 12);

    ctx.fillStyle = '#8899aa';
    ctx.font = '12px system-ui';
    const lines = [
      '1-5    Select word by column',
      'Space  Pause / Resume',
      'P      Pause / Resume',
      'H      Toggle this help',
      'M      Toggle sound',
    ];
    lines.forEach((line, i) => {
      ctx.fillText(line, px + 12, py + 36 + i * 22);
    });
  }
}

// ── Sentence card (shown after each word) ─────────────────────────────────────
function drawSentenceCard() {
  const W = canvas.width;
  const H = canvas.height;

  // Semi-transparent backdrop
  ctx.fillStyle = 'rgba(0, 5, 20, 0.85)';
  ctx.fillRect(0, 0, W, H);

  // Card dimensions
  const cardW = Math.min(600, W - 60);
  const cardH = 200;
  const cx = (W - cardW) / 2;
  const cy = (H - cardH) / 2 - 20;

  // Card background
  ctx.fillStyle = '#090e22';
  ctx.strokeStyle = sentenceCard.success ? '#2a7a4a' : '#7a2a2a';
  ctx.lineWidth = 2;
  ctx.fillRect(cx, cy, cardW, cardH);
  ctx.strokeRect(cx, cy, cardW, cardH);

  // Result indicator
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 14px system-ui';
  ctx.fillStyle = sentenceCard.success ? '#66ee88' : '#ee6666';
  ctx.fillText(sentenceCard.success ? '✓ Correct!' : '✗ Incorrect', W / 2, cy + 28);

  // Word
  ctx.font = 'bold 26px monospace';
  ctx.fillStyle = '#88ddff';
  ctx.fillText(sentenceCard.word, W / 2, cy + 65);

  // Sentence
  ctx.font = '15px system-ui';
  ctx.fillStyle = '#8899aa';
  wrapTextCentered(sentenceCard.sentence, W / 2, cy + 105, cardW - 40, 22);

  // Prompt to continue
  ctx.font = '12px system-ui';
  ctx.fillStyle = '#445566';
  ctx.fillText('Press Space or click to continue', W / 2, cy + cardH - 16);
}

function wrapTextCentered(text, cx, y, maxW, lineH) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (const word of words) {
    const test = line ? `${line} ${word}` : word;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = word;
    } else { line = test; }
  }
  if (line) lines.push(line);
  // Center vertically
  const startY = y - ((lines.length - 1) * lineH) / 2;
  lines.forEach((l, i) => {
    ctx.fillText(l, cx, startY + i * lineH);
  });
}

// ── Click feedback (ripple effect) ────────────────────────────────────────────
let clickRipples = [];  // {x, y, radius, alpha, color}

function addClickRipple(x, y, color) {
  clickRipples.push({ x, y, radius: 5, alpha: 0.8, color });
}

function updateAndDrawRipples() {
  for (let i = clickRipples.length - 1; i >= 0; i--) {
    const r = clickRipples[i];
    r.radius += 3;
    r.alpha -= 0.03;
    if (r.alpha <= 0) { clickRipples.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = r.alpha;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Click handler ─────────────────────────────────────────────────────────────
const VERTICAL_LENIENCY = 0.25;  // 25% of screen height

canvas.addEventListener('click', e => {
  // Dismiss sentence card on click
  if (sentenceCard && sentenceCard.waiting) {
    sentenceCard = null;
    pendingBadge = null;
    nextWord();
    return;
  }

  if (!activeWord || wordResolved || paused) return;

  const rect = canvas.getBoundingClientRect();
  const mx   = (e.clientX - rect.left)  * (canvas.width  / rect.width);
  const my   = (e.clientY - rect.top)   * (canvas.height / rect.height);

  // Ignore clicks in HUD zones (header + word banner, footer)
  const headerH = 56;
  const wordH   = 88;
  const footerH = 54;
  if (my < headerH + wordH || my > canvas.height - footerH) return;

  const vLeniency = canvas.height * VERTICAL_LENIENCY;
  let clicked = false;

  for (const t of tokens) {
    if (t.state !== 'falling') continue;
    // Horizontal: strict (must be within token width)
    // Vertical: lenient (25% of screen height above and below token)
    if (mx >= t.x - t.w / 2 && mx <= t.x + t.w / 2 &&
        my >= t.y - t.h / 2 - vLeniency && my <= t.y + t.h / 2 + vLeniency) {

      clicked = true;
      if (t.isCorrect) {
        // Correct: clicked the right spelling
        t.state = 'clicked_ok';
        t.scale = 1.0;
        score++;
        addClickRipple(t.x, t.y, '#00ff88');
        // Fade remaining tokens
        tokens.forEach(tt => { if (tt.state === 'falling') tt.state = 'fade'; });
        resolveWord(true);
      } else {
        // Wrong: clicked a misspelling
        t.state = 'clicked_err';
        t.scale = 1.0;
        addClickRipple(t.x, t.y, '#ff4444');
        // Fade everything and end word
        tokens.forEach(tt => { if (tt.state === 'falling') tt.state = 'fade'; });
        resolveWord(false, 'wrong_click');
      }
      break;
    }
  }

  // Show a ripple even if nothing was hit (so user sees their click registered)
  if (!clicked) {
    addClickRipple(mx, my, '#446688');
  }
});

// ── Keyboard handler ──────────────────────────────────────────────────────────
let showHelp = false;

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();

  // Dismiss sentence card with Space or Enter
  if ((key === ' ' || key === 'enter') && sentenceCard && sentenceCard.waiting) {
    e.preventDefault();
    sentenceCard = null;
    pendingBadge = null;
    nextWord();
    return;
  }

  // Pause toggle: Space or P
  if (key === ' ' || key === 'p') {
    e.preventDefault();
    if (gameRunning && !sentenceCard) {
      paused = !paused;
    }
    return;
  }

  // Help toggle: H
  if (key === 'h') {
    showHelp = !showHelp;
    return;
  }

  // Sound toggle: M
  if (key === 'm') {
    soundEnabled = !soundEnabled;
    wd().sound_enabled = soundEnabled;
    saveProgress();
    return;
  }

  // Number keys 1-5: click token by column (left to right)
  if (key >= '1' && key <= '5' && gameRunning && !paused && activeWord && !wordResolved) {
    const idx = parseInt(key) - 1;
    // Sort falling tokens by x position to determine column order
    const falling = tokens.filter(t => t.state === 'falling').sort((a, b) => a.x - b.x);
    if (idx < falling.length) {
      const t = falling[idx];
      if (t.isCorrect) {
        t.state = 'clicked_ok';
        t.scale = 1.0;
        score++;
        addClickRipple(t.x, t.y, '#00ff88');
        tokens.forEach(tt => { if (tt.state === 'falling') tt.state = 'fade'; });
        resolveWord(true);
      } else {
        t.state = 'clicked_err';
        t.scale = 1.0;
        addClickRipple(t.x, t.y, '#ff4444');
        tokens.forEach(tt => { if (tt.state === 'falling') tt.state = 'fade'; });
        resolveWord(false, 'wrong_click');
      }
    }
    return;
  }
});

// ── Utilities ─────────────────────────────────────────────────────────────────
function pill(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function truncateText(text, maxW) {
  ctx.font = 'italic 15px system-ui';
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 0 && ctx.measureText(t + '…').width > maxW) {
    t = t.slice(0, -1);
  }
  return t + '…';
}

function pickSentence(wordData) {
  const arr = wordData.sentences || [];
  if (arr.length > 0) return arr[Math.floor(Math.random() * arr.length)];
  return wordData.sentence || '';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
window.onerror = function(msg, url, line) {
  document.getElementById('screen-loading').innerHTML =
    `<h1 style="color:#ff4444">JS Error</h1><p style="color:#aaa">${msg}</p><p style="color:#667;font-size:.8rem">Line ${line}</p>`;
  document.getElementById('overlay').classList.remove('hidden');
};
loadAll();
</script>
